[project]
name = "highbay-sim"
version = "0.5.0"
description = "Headless throughput simulation of a high-bay warehouse"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "PyYAML>=6.0",
]

[project.scripts]
highbay-sim = "highbay_sim.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "playwright>=1.50",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/highbay_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "omniverse/exts/highbay.replay"]
addopts = "-ra -m 'not omniverse'"
markers = [
    "performance: measures performance targets",
    "viewer: runs in a headless browser",
    "omniverse: runs in Omniverse Kit, and only on request with -m omniverse",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "omniverse/exts/highbay.replay"]
extend-exclude = [".specify", "specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "omniverse/exts/highbay.replay/highbay/replay/core"]
mypy_path = ["src", "omniverse/exts/highbay.replay"]
namespace_packages = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]
