# Variant of small-warehouse: speeds x 1.5 and accelerations x 2.25, which divides every travel time by 1.5.
# All values are illustrative.
schema_version: 1
name: higher-speed
layout:
  aisle_count: 4
  racks_per_aisle: 2
  bays_per_rack: 40
  levels_per_rack: 10
  cell:
    height_m: 1.5
    length_m: 3.2
    width_m: 1.5
crane:
  horizontal: { speed_m_s: 4.5, acceleration_m_s2: 1.125 }
  vertical: { speed_m_s: 1.5, acceleration_m_s2: 1.125 }
  pick_time_s: 12.0
  set_time_s: 12.0
transfer_points:
  default:
    left: [inbound]
    right: [outbound]
storage_rule: nearest_free
