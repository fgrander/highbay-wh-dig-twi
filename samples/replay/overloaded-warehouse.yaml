# Sample warehouse for spotting bottlenecks. Stock fills the nearest cells of aisles 2 and 3, so the
# nearest_free rule sends new storage orders to aisle 1 and overloads its crane.
# All values are illustrative.
schema_version: 1
name: overloaded-warehouse
layout:
  aisle_count: 3
  racks_per_aisle: 2
  bays_per_rack: 20
  levels_per_rack: 5
  cell:
    height_m: 1.5
    length_m: 3.2
    width_m: 1.5
crane:
  horizontal: { speed_m_s: 3.0, acceleration_m_s2: 0.5 }
  vertical: { speed_m_s: 1.0, acceleration_m_s2: 0.5 }
  pick_time_s: 12.0
  set_time_s: 12.0
transfer_points:
  default:
    left: [inbound]
    right: [outbound]
storage_rule: nearest_free
initial_stock:
  - { location: { aisle: 2, rack: 1, bay: 1, level: 1 }, article: paper-a4-80g }
  - { location: { aisle: 2, rack: 1, bay: 1, level: 2 }, article: paper-a4-80g }
