# Sample warehouse with cells for the real sizes of paper (5.61 m by 2.08 m) and particle boards
# (5.6 m by 2.07 m). The cell's length and width are derived from those sizes, and its height,
# the counts, and the crane are placeholders, so results say nothing about a real warehouse yet.
schema_version: 1
name: real-size-warehouse
layout:
  aisle_count: 2
  racks_per_aisle: 2
  bays_per_rack: 20
  levels_per_rack: 8
  cell:
    height_m: 1.5
    length_m: 5.8
    width_m: 2.3
crane:
  horizontal: { speed_m_s: 3.0, acceleration_m_s2: 0.5 }
  vertical: { speed_m_s: 1.0, acceleration_m_s2: 0.5 }
  pick_time_s: 12.0
  set_time_s: 12.0
transfer_points:
  default:
    left: [inbound]
    right: [outbound]
storage_rule: nearest_free
initial_stock:
